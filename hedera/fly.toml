# fly.toml app configuration file generated for agensea-hedera-x402 on 2026-09-11T09:04:16+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agensea-hedera-x402'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '4021'
  PUBLIC_URL = 'https://agensea-hedera-x402.fly.dev'

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
